<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación del clima</title>
    <link rel ="stylesheet" href="style.css">
</head>
<body>
<div class = "card">
    <div class = "search">
        <input type="text" placeholder="Ingrese el nombre de la ciudad" 
        spellcheck="false">
        <button><img src="imagenes/search.png" alt="Buscar"> </button>
    </div>
    <div class="error">
        <p>Ciudad no encontrada</p>
    </div>
    <div class = "clima">
        <img src="imagenes/rain.png" class="weather-icon" alt="icono del clima">
        <h1 class= "temperatura">--°C</h1>
        <h2 class="ciudad"> Nueva York</h2>
        <div class="detalles">
            <div class="col">
                <img src="imagenes/humidity.png" alt="icono de humedad">
                <div>
                    <p class="humedad">50%</p>
                    <p>Humedad</p>
                </div>
            </div>   
            <div class="col">
                <img src="imagenes/wind.png" alt="icono de viento">
                <div>
                    <p class="viento">15 km/h</p>
                    <p>Velocidad del viento </p>
                </div>
            </div> 
        </div>
    </div>
</div>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
